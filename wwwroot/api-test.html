<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .api-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-api {
            margin: 5px;
        }
        .response-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .method-badge {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        .method-get { background: #28a745; color: white; }
        .method-post { background: #007bff; color: white; }
        .method-put { background: #ffc107; color: black; }
        .method-patch { background: #17a2b8; color: white; }
        .method-delete { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="text-center text-white mb-4">
                    <h1><i class="fas fa-car"></i> API Test Dashboard</h1>
                    <p>Hệ thống quản lý cho thuê xe ô tô</p>
                    <a href="/swagger" class="btn btn-light" target="_blank">
                        <i class="fas fa-book"></i> Swagger Documentation
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Xe API -->
            <div class="col-md-6">
                <div class="api-card">
                    <h3><i class="fas fa-car text-primary"></i> Xe API</h3>
                    <hr>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/XeApi')">
                        <span class="method-badge method-get">GET</span> Lấy tất cả xe
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/XeApi/1')">
                        <span class="method-badge method-get">GET</span> Xe theo ID
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/XeApi/search?loaixe=SUV')">
                        <span class="method-badge method-get">GET</span> Tìm kiếm xe
                    </button>
                    <button class="btn btn-primary btn-api btn-sm" onclick="testCreateXe()">
                        <span class="method-badge method-post">POST</span> Tạo xe mới
                    </button>
                </div>
            </div>

            <!-- Người Dùng API -->
            <div class="col-md-6">
                <div class="api-card">
                    <h3><i class="fas fa-users text-success"></i> Người Dùng API</h3>
                    <hr>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/NguoiDungApi')">
                        <span class="method-badge method-get">GET</span> Lấy tất cả
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/NguoiDungApi/1')">
                        <span class="method-badge method-get">GET</span> Theo ID
                    </button>
                    <button class="btn btn-primary btn-api btn-sm" onclick="testCreateUser()">
                        <span class="method-badge method-post">POST</span> Tạo mới
                    </button>
                </div>
            </div>

            <!-- Đặt Xe API -->
            <div class="col-md-6">
                <div class="api-card">
                    <h3><i class="fas fa-calendar-check text-warning"></i> Đặt Xe API</h3>
                    <hr>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/DatXeApi')">
                        <span class="method-badge method-get">GET</span> Tất cả đơn
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/DatXeApi/1')">
                        <span class="method-badge method-get">GET</span> Theo ID
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/DatXeApi/khachhang/1')">
                        <span class="method-badge method-get">GET</span> Theo khách hàng
                    </button>
                    <button class="btn btn-primary btn-api btn-sm" onclick="testCreateBooking()">
                        <span class="method-badge method-post">POST</span> Tạo đơn
                    </button>
                </div>
            </div>

            <!-- Khách Hàng API -->
            <div class="col-md-6">
                <div class="api-card">
                    <h3><i class="fas fa-user-tie text-info"></i> Khách Hàng API</h3>
                    <hr>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/KhachHangApi')">
                        <span class="method-badge method-get">GET</span> Tất cả
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/KhachHangApi/1')">
                        <span class="method-badge method-get">GET</span> Theo ID
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/KhachHangApi/user/1')">
                        <span class="method-badge method-get">GET</span> Theo User
                    </button>
                    <button class="btn btn-info btn-api btn-sm" onclick="callAPI('PATCH', '/api/KhachHangApi/1/verify')">
                        <span class="method-badge method-patch">PATCH</span> Xác thực
                    </button>
                </div>
            </div>

            <!-- Thanh Toán API -->
            <div class="col-md-6">
                <div class="api-card">
                    <h3><i class="fas fa-credit-card text-danger"></i> Thanh Toán API</h3>
                    <hr>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/ThanhToanApi')">
                        <span class="method-badge method-get">GET</span> Tất cả
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/ThanhToanApi/1')">
                        <span class="method-badge method-get">GET</span> Theo ID
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/ThanhToanApi/datxe/1')">
                        <span class="method-badge method-get">GET</span> Theo đơn
                    </button>
                </div>
            </div>

            <!-- Lịch Sử Thuê API -->
            <div class="col-md-6">
                <div class="api-card">
                    <h3><i class="fas fa-history text-secondary"></i> Lịch Sử Thuê API</h3>
                    <hr>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/LichSuThueApi')">
                        <span class="method-badge method-get">GET</span> Tất cả
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/LichSuThueApi/khachhang/1')">
                        <span class="method-badge method-get">GET</span> Theo KH
                    </button>
                    <button class="btn btn-success btn-api btn-sm" onclick="callAPI('GET', '/api/LichSuThueApi/xe/1')">
                        <span class="method-badge method-get">GET</span> Theo xe
                    </button>
                </div>
            </div>
        </div>

        <!-- Response Box -->
        <div class="row">
            <div class="col-12">
                <div class="api-card">
                    <h4><i class="fas fa-terminal"></i> Response</h4>
                    <button class="btn btn-sm btn-secondary mb-2" onclick="clearResponse()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                    <div id="response" class="response-box">
                        <em class="text-muted">Nhấn một button API để xem kết quả...</em>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function callAPI(method, url, data = null) {
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = `<div class="text-info"><i class="fas fa-spinner fa-spin"></i> Đang gọi API: ${method} ${url}</div>`;

            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if (data) {
                options.body = JSON.stringify(data);
            }

            fetch(url, options)
                .then(response => {
                    const status = response.status;
                    return response.json().then(data => ({ status, data }));
                })
                .catch(error => {
                    return { status: 'Error', data: error.message };
                })
                .then(result => {
                    const statusColor = result.status >= 200 && result.status < 300 ? 'success' : 'danger';
                    responseDiv.innerHTML = `
                        <div class="alert alert-${statusColor}">
                            <strong>${method} ${url}</strong><br>
                            Status: ${result.status}
                        </div>
                        <pre>${JSON.stringify(result.data, null, 2)}</pre>
                    `;
                });
        }

        function testCreateXe() {
            const data = {
                tenxe: "Test Car " + Date.now(),
                hangxe: "Toyota",
                loaixe: "SUV",
                sochongoi: 7,
                namsanxuat: 2024,
                mauxe: "Trắng",
                biensoxe: "30A-" + Math.floor(Math.random() * 10000),
                giathuetheongay: 800000,
                mota: "Xe test từ API Dashboard"
            };
            callAPI('POST', '/api/XeApi', data);
        }

        function testCreateUser() {
            const data = {
                email: `test${Date.now()}@example.com`,
                password: "123456",
                hoten: "Test User",
                sodienthoai: "0123456789",
                vaitro: "Customer"
            };
            callAPI('POST', '/api/NguoiDungApi', data);
        }

        function testCreateBooking() {
            const start = new Date();
            const end = new Date();
            end.setDate(end.getDate() + 3);

            const data = {
                xeid: 1,
                khachhangid: 1,
                ngaybatdau: start.toISOString(),
                ngayketthuc: end.toISOString(),
                diadiemnhan: "123 Test Street",
                diadiemtra: "456 Test Avenue"
            };
            callAPI('POST', '/api/DatXeApi', data);
        }

        function clearResponse() {
            document.getElementById('response').innerHTML = '<em class="text-muted">Response cleared.</em>';
        }
    </script>
</body>
</html>
